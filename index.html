<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PC방 게임 순위</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #000000;
    --frame: #c8c8c8;
    --line: #2a2a2a;
    --text: #f2f2f2;
    --muted: #8c8c8c;
    --accent: #e8e8e8;
    --error: #ff6b6b;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    min-height: 100vh;
    padding: 16px;
    line-height: 1.5;
  }

  .frame {
    max-width: 980px;
    margin: 0 auto;
    border: 2px solid var(--frame);
    display: grid;
    grid-template-columns: 240px 1fr;
    min-height: calc(100vh - 32px);
  }

  /* 왼쪽: 근처 PC방 찾기 */
  .finder {
    border-right: 1px solid var(--frame);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }
  .finder button {
    background: none;
    border: 0;
    color: var(--text);
    font: inherit;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    padding: 20px 16px;
    border-radius: 12px;
  }
  .finder .icon { font-size: 72px; line-height: 1; transition: transform .15s ease; }
  .finder button:hover .icon { transform: scale(1.08); }
  .finder .label { font-size: 17px; font-weight: 600; }
  .finder .hint { font-size: 13px; color: var(--muted); min-height: 1.5em; margin-top: 8px; text-align: center; }

  .finder .weblink { margin-top: 10px; font-size: 13px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; text-align: center; }
  .finder .weblink:hover { color: var(--text); }

  /* 오른쪽: 순위표 */
  .board { display: flex; flex-direction: column; padding: 24px 28px; min-width: 0; }
  .board-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; font-weight: 700; }
  .status { font-size: 12px; color: var(--muted); }

  .list { list-style: none; margin: 16px 0 0; padding: 0; flex: 1; position: relative; min-height: 460px; }
  .row {
    display: grid;
    grid-template-columns: 48px 1fr auto;
    align-items: center;
    gap: 14px;
    height: 46px;
    border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: 0; }
  .rank { display: flex; justify-content: center; }
  .rank-num { font-size: 16px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .medal {
    width: 32px; height: 32px; border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 800; font-size: 16px; color: #2b2b2b;
    box-shadow: inset 0 -3px 5px rgba(0,0,0,.28), inset 0 2px 3px rgba(255,255,255,.55);
  }
  .medal.gold   { background: radial-gradient(circle at 35% 30%, #fff1a6, #f2c230 55%, #b98a07); border: 2px solid #d9a91a; }
  .medal.silver { background: radial-gradient(circle at 35% 30%, #ffffff, #cfd3d8 55%, #8e949c); border: 2px solid #aeb3ba; }
  .medal.bronze { background: radial-gradient(circle at 35% 30%, #ffd9b0, #cd8a4b 55%, #8a5225); border: 2px solid #a86a33; color: #2a1608; }
  .name { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .share { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .message {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; text-align: center; padding: 16px;
  }
  .message .big { font-size: 28px; font-weight: 800; color: var(--error); }
  .message .small { font-size: 14px; color: var(--muted); }
  .message.loading .big { color: var(--muted); font-size: 16px; font-weight: 500; }

  .pager { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; }
  .pager button {
    width: 56px; height: 44px; border-radius: 10px;
    background: #000; color: var(--text);
    border: 1px solid var(--frame);
    font-size: 20px; cursor: pointer;
  }
  .pager button:hover:not(:disabled) { background: #1c1c1c; }
  .pager button:disabled { opacity: .3; cursor: default; }
  .pager .page-info { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

  button:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  @media (max-width: 720px) {
    body { padding: 10px; }
    .frame { grid-template-columns: 1fr; min-height: 0; }
    .finder { border-right: 0; border-bottom: 1px solid var(--frame); padding: 20px 16px; }
    .finder .icon { font-size: 52px; }
    .board { padding: 18px 16px; }
    .list { min-height: 460px; }
  }
  @media (prefers-reduced-motion: reduce) { .finder .icon { transition: none; } }
</style>
</head>
<body>
<main class="frame">
  <section class="finder" aria-label="근처 PC방 찾기">
    <button id="findBtn" type="button" aria-label="근처 PC방 찾기">
      <span class="icon" aria-hidden="true">🔍</span>
      <span class="label">근처 PC방 찾기</span>
    </button>
    <a class="weblink" id="webLink" href="https://map.naver.com/p/search/PC%EB%B0%A9" target="_blank" rel="noopener noreferrer">앱이 안 열리면 웹 지도로 보기</a>
  </section>

  <section class="board" aria-label="PC방 게임 순위표">
    <div class="board-head">
      <h1>PC방 게임 순위</h1>
      <div class="status" id="status"></div>
    </div>
    <ol class="list" id="list"></ol>
    <div class="pager">
      <button id="prev" type="button" aria-label="이전 10위">◀</button>
      <span class="page-info" id="pageInfo"></span>
      <button id="next" type="button" aria-label="다음 10위">▶</button>
    </div>
  </section>
</main>

<script>
/* ===== 설정 =====
   DATA_URL: 순위 데이터를 돌려주는 주소(JSON). 형식 예:
     [ {"rank":1,"name":"리그 오브 레전드","share":38.2}, ... ]  (share는 선택)
   비워 두면 순위를 불러올 수 없으므로 "오류"가 표시됩니다. */
const DATA_URL = "";
const REFRESH_MS = 15 * 60 * 1000; // 15분
const PAGE_SIZE = 10;
const TOTAL = 30;

const listEl = document.getElementById("list");
const statusEl = document.getElementById("status");
const pageInfoEl = document.getElementById("pageInfo");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");

let data = [];      // 현재 순위 데이터
let page = 0;       // 0부터 시작
let signature = ""; // 순위 변경 감지용
let state = "loading"; // loading | ok | error

/* ----- 데이터 불러오기 ----- */
async function loadRanking() {
  if (!DATA_URL) throw new Error("no data source");
  if (navigator.onLine === false) throw new Error("offline");
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 10000);
  try {
    const res = await fetch(DATA_URL, { cache: "no-store", signal: ctrl.signal });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const json = await res.json();
    if (!Array.isArray(json) || json.length === 0) throw new Error("bad data");
    const items = json
      .map((it, i) => typeof it === "string"
        ? { rank: i + 1, name: it }
        : { rank: Number(it.rank) || i + 1, name: String(it.name ?? ""), share: it.share })
      .filter(it => it.name)
      .sort((a, b) => a.rank - b.rank)
      .slice(0, TOTAL);
    if (items.length === 0) throw new Error("bad data");
    return items;
  } finally {
    clearTimeout(timer);
  }
}

async function refresh() {
  try {
    const next = await loadRanking();
    const sig = JSON.stringify(next);
    const changed = sig !== signature || state !== "ok";
    signature = sig;
    data = next;
    state = "ok";
    setStatus();
    if (changed) render();   // 순위가 바뀐 경우에만 다시 그림 (현재 페이지 유지)
  } catch (e) {
    state = "error";
    signature = "";
    setStatus();
    render();
  }
}

/* ----- 화면 그리기 ----- */
function setStatus() {
  if (state === "error") { statusEl.textContent = "업데이트 실패"; return; }
  const t = new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" });
  statusEl.textContent = t + " 업데이트 · 15분마다 자동 갱신";
}

function medalClass(rank) { return rank === 1 ? "gold" : rank === 2 ? "silver" : rank === 3 ? "bronze" : ""; }

function render() {
  listEl.innerHTML = "";

  if (state === "loading") {
    listEl.innerHTML = '<li class="message loading"><span class="big">순위를 불러오는 중…</span></li>';
    updatePager(); return;
  }
  if (state === "error") {
    listEl.innerHTML = '<li class="message"><span class="big">오류</span><span class="small">순위를 표시할 수 없습니다. 인터넷 연결을 확인하세요. 15분 후 자동으로 다시 시도합니다.</span></li>';
    updatePager(); return;
  }

  const pages = Math.ceil(data.length / PAGE_SIZE);
  if (page > pages - 1) page = pages - 1;
  const slice = data.slice(page * PAGE_SIZE, page * PAGE_SIZE + PAGE_SIZE);
  const frag = document.createDocumentFragment();
  slice.forEach((item, idx) => {
    const rank = page * PAGE_SIZE + idx + 1;
    const li = document.createElement("li");
    li.className = "row";

    const rankBox = document.createElement("span");
    rankBox.className = "rank";
    const mc = medalClass(rank);
    const badge = document.createElement("span");
    badge.className = mc ? "medal " + mc : "rank-num";
    badge.textContent = rank;
    if (mc) badge.setAttribute("aria-label", rank + "위");
    rankBox.appendChild(badge);

    const name = document.createElement("span");
    name.className = "name";
    name.textContent = item.name;
    name.title = item.name;

    const share = document.createElement("span");
    share.className = "share";
    share.textContent = item.share != null && item.share !== "" ? item.share + "%" : "";

    li.append(rankBox, name, share);
    frag.appendChild(li);
  });
  listEl.appendChild(frag);
  updatePager();
}

function updatePager() {
  const pages = Math.max(1, Math.ceil((data.length || TOTAL) / PAGE_SIZE));
  const from = page * PAGE_SIZE + 1;
  const to = Math.min((page + 1) * PAGE_SIZE, data.length || TOTAL);
  pageInfoEl.textContent = state === "ok" ? from + " – " + to + "위" : "";
  prevBtn.disabled = state !== "ok" || page === 0;
  nextBtn.disabled = state !== "ok" || page >= pages - 1;
}

prevBtn.addEventListener("click", () => { if (page > 0) { page--; render(); } });
nextBtn.addEventListener("click", () => {
  if ((page + 1) * PAGE_SIZE < data.length) { page++; render(); }
});

/* ----- 근처 PC방 찾기 (네이버 지도 앱 실행) -----
   이 페이지는 안전 격리된 화면(iframe) 안에서 열릴 수 있어서, 현재 화면을 직접 이동시키면
   지도 사이트가 표시되지 않습니다. 그래서 항상 "새 창/새 탭"으로 엽니다. */
const APP_NAME = "com.pcbang.ranking";
const QUERY = encodeURIComponent("PC방");
const WEB_URL = "https://map.naver.com/p/search/" + QUERY;

function openNew(url) {
  const w = window.open(url, "_blank", "noopener");
  return !!w;
}

document.getElementById("findBtn").addEventListener("click", () => {
  const ua = navigator.userAgent;
  const touch = (navigator.maxTouchPoints || 0) > 1;
  // 태블릿은 "데스크톱 사이트" 모드라 UA에 Android/iPad가 없을 수 있어 터치 여부도 함께 확인
  const isAndroid = /Android/i.test(ua) || (touch && /Linux|X11/i.test(ua) && !/Windows/i.test(ua));
  const isIOS = /iPhone|iPad|iPod/i.test(ua) || (touch && /Macintosh/i.test(ua));

  // PC: 웹 지도를 새 탭으로
  if (!isAndroid && !isIOS) { openNew(WEB_URL); return; }

  const appUrl = isAndroid
    ? "intent://search?query=" + QUERY + "&appname=" + APP_NAME
      + "#Intent;scheme=nmap;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;package=com.nhn.android.nmap;S.browser_fallback_url=" + encodeURIComponent(WEB_URL) + ";end"
    : "nmap://search?query=" + QUERY + "&appname=" + APP_NAME;

  // 안드로이드는 intent의 browser_fallback_url이 앱이 없을 때 웹 지도로 보내줍니다.
  if (!openNew(appUrl)) {
    // 새 창이 막혔을 때: 현재 화면에서 시도, 그래도 안 되면 아래 "웹 지도로 보기" 링크를 누르면 됩니다.
    window.location.href = appUrl;
  }
});

/* ----- 시작 & 15분 자동 갱신 ----- */
render();
refresh();
setInterval(refresh, REFRESH_MS);
window.addEventListener("online", refresh);   // 인터넷이 다시 연결되면 바로 갱신
</script>
</body>
</html>
